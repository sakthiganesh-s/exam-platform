spring:
  cloud:
    gateway:
      routes:
        - id: candidate-service
          uri: http://localhost:8001
          predicates: [Path=/api/candidates/**]
        - id: exam-service
          uri: http://localhost:8002
          predicates: [Path=/api/exams/**]
        - id: question-service
          uri: http://localhost:8003
          predicates: [Path=/api/questions/**]
        - id: answer-service
          uri: http://localhost:8004
          predicates: [Path=/api/answers/**]
        - id: result-service
          uri: http://localhost:8005
          predicates: [Path=/api/results/**]
