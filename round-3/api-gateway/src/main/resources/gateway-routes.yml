spring:
  cloud:
    gateway:
      routes:
        - id: candidate-service
          uri: http://localhost:9001
          predicates: [Path=/api/candidates/**]
        - id: exam-service
          uri: http://localhost:9002
          predicates: [Path=/api/exams/**]
        - id: question-service
          uri: http://localhost:9003
          predicates: [Path=/api/questions/**]
        - id: answer-service
          uri: http://localhost:9004
          predicates: [Path=/api/answers/**]
        - id: result-service
          uri: http://localhost:9005
          predicates: [Path=/api/results/**]
        - id: notification-service
          uri: http://localhost:9006
          predicates: [Path=/api/notifications/**]
